<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>BEFORETHESARCOPHAGUS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #ece6d8;
      --paper-shadow: #d8d0bc;
      --ink: #2b2520;
      --ink-soft: #5a5042;
      --ink-faint: #8c8170;
      --tear-line: #b8ac94;
      --aside: #6a5f4c;
      --accent: #6b1f1f;
      --serif-en: 'Cormorant Garamond', serif;
      --serif-cn: 'Noto Serif SC', serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      background: #15130f;
      font-family: var(--serif-cn), var(--serif-en), serif;
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #paper {
      position: relative;
      width: 100%;
      max-width: min(720px, 100vw);
      margin: 2rem auto 4rem;
      background:
        radial-gradient(ellipse at 20% 10%, rgba(255,255,255,.25), transparent 40%),
        radial-gradient(ellipse at 85% 70%, rgba(0,0,0,.04), transparent 50%),
        var(--paper);
      box-shadow: 0 0 80px rgba(0,0,0,.5), 0 0 0 1px rgba(0,0,0,.05);
      padding: 10vh 7vw 22vh;
      min-height: 100vh;
      border-radius: 2px;
    }

    /* ── 左上角返回箭头：回到页面初始状态 ── */
    #btn-back {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 90;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(232, 226, 216, 0.28);
      border-radius: 50%;
      background: rgba(21, 19, 15, 0.55);
      color: rgba(232, 226, 216, 0.72);
      cursor: pointer;
      transition: background .25s ease, color .25s ease, border-color .25s ease;
    }
    #btn-back:hover {
      border-color: rgba(232, 226, 216, 0.85);
      color: #ece6d8;
      background: rgba(21, 19, 15, 0.85);
    }

    #paper::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("[image omitted]%3Csvg xmlns='http://www.w3.org/2000/svg' width='120' height='120'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      pointer-events: none;
      mix-blend-mode: multiply;
    }

    #paper::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 14px;
      background: var(--paper);
      clip-path: polygon(0% 100%, 2% 30%, 5% 80%, 8% 10%, 12% 60%, 16% 20%, 20% 90%, 24% 40%, 28% 70%, 32% 15%, 36% 55%, 40% 25%, 44% 85%, 48% 35%, 52% 65%, 56% 10%, 60% 50%, 64% 80%, 68% 20%, 72% 60%, 76% 30%, 80% 90%, 84% 45%, 88% 15%, 92% 70%, 96% 25%, 100% 100%);
      transform: translateY(-13px);
    }

    #tear-edge {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 14px;
      background: repeating-linear-gradient(180deg, transparent 0 6px, rgba(0,0,0,.06) 6px 7px, transparent 7px 18px);
      opacity: 0.45;
      pointer-events: none;
    }

    #letterhead {
      margin-bottom: 8vh;
      padding-bottom: 2em;
      border-bottom: 1px solid var(--tear-line);
      opacity: 0.85;
    }
    #letterhead .num {
      font-family: var(--serif-en);
      font-style: italic;
      font-size: 13px;
      letter-spacing: .18em;
      color: var(--ink-faint);
    }
    #letterhead .ttl {
      font-family: var(--serif-cn);
      font-size: 15px;
      letter-spacing: .4em;
      color: var(--ink-soft);
      margin-top: .6em;
    }

    #manuscript {
      font-size: 18px;
      line-height: 2.1;
      letter-spacing: .01em;
      position: relative;
      word-break: break-word;
    }
    #manuscript p { margin-bottom: 1.7em; font-weight: 400; }

    .ln {
      display: inline;
      opacity: 0;
      filter: blur(2px);
      transition: opacity 1.1s ease, filter 1.1s ease;
    }
    .ln.seen { opacity: 1; filter: blur(0); }

    /* 粗体样式 */
    .ln b, .ln strong, .aside b, .aside strong {
      font-weight: 700;
      color: var(--ink);
    }

    /* 斜体样式 */
    .ln i, .ln em, .aside i, .aside em {
      font-style: italic;
      color: var(--ink-soft);
    }

    .aside {
      display: block;
      margin: 1.4em 0 1.6em 1.2em;
      padding-left: 1em;
      border-left: 2px solid var(--tear-line);
      font-family: var(--serif-cn), var(--serif-en), serif;
      font-style: italic;
      font-size: 18px;
      letter-spacing: .01em;
      color: var(--aside);
      opacity: 0;
      filter: blur(2px);
      transition: opacity 1.1s ease, filter 1.1s ease;
      break-inside: avoid;
    }
    .aside.seen { opacity: 0.9; filter: blur(0); }
    .aside .tag {
      font-style: normal;
      font-weight: 600;
      letter-spacing: .1em;
      color: var(--ink-faint);
      margin-right: .5em;
      font-size: 0.9em;
    }

    /* 第二段内容：验证成功后就地展开，不跳转 */
    #unlock {
      display: none;
      margin-top: 12vh;
      padding-top: 5vh;
      border-top: 1px solid var(--tear-line);
    }
    #unlock.revealed { display: block; text-align: center; }

    /* 底部输入入口：半公开页，后端做密钥校验与频率限制 */
    #invert-gate {
      margin-top: 12vh;
      padding-top: 5vh;
      border-top: 1px dashed var(--tear-line);
      text-align: center;
    }

    #gate-prompt {
      font-family: var(--serif-en);
      font-style: italic;
      font-size: 16px;
      color: var(--ink-faint);
      letter-spacing: .1em;
      margin-bottom: 1.8em;
      min-height: 1.6em;
      font-weight: 500;
    }

    #gate-input-wrap {
      display: inline-flex;
      align-items: center;
      gap: .6em;
      border-bottom: 1px solid var(--ink-faint);
      padding: .3em .2em;
    }
    #gate-input-wrap::before {
      content: '>';
      color: var(--ink-faint);
      font-family: var(--serif-en);
    }
    #gate-input {
      font-family: var(--serif-en);
      font-size: 16px;
      letter-spacing: .15em;
      background: transparent;
      border: none;
      outline: none;
      color: var(--ink);
      width: 220px;
      text-align: center;
    }
    #gate-input::placeholder {
      color: var(--ink-faint);
      opacity: .5;
    }

    #gate-error {
      margin-top: 1em;
      font-family: var(--serif-en);
      font-style: italic;
      font-size: 12px;
      color: var(--accent);
      opacity: 0;
      transition: opacity .4s ease;
    }
    #gate-error.show { opacity: .75; }

    @media (max-width: 560px) {
      #paper { margin: 1rem auto 3rem; padding: 8vh 6vw 18vh; }
      #manuscript { font-size: clamp(16px, 4.8vw, 18px); line-height: 2; }
      #gate-input { width: 180px; }
      #btn-back { top: 10px; left: 10px; width: 40px; height: 40px; }
    }
  </style>
</head>
<body>
<!-- 左上角返回箭头：回到页面初始状态 -->
<button id="btn-back" title="返回初始页面" aria-label="返回初始页面">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
</button>
<div id="paper">
  <div id="tear-edge"></div>
  <div id="letterhead">
    <div class="num">α</div>
    <div class="ttl">在石棺之前</div>
  </div>

  <div id="manuscript"></div>

  <!-- 验证成功后原地展开的第二段内容 -->
  <div id="unlock"></div>

  <!-- 单次密钥输入入口，密钥只发送给后端校验 -->
  <div id="invert-gate">
    <div id="gate-prompt">WHAT DO YOU REMEMBER?</div>
    <div id="gate-input-wrap">
      <input id="gate-input" type="text" autocomplete="off" spellcheck="false">
    </div>
    <div id="gate-error">这句话没有说完</div>
  </div>
</div>

<script>
  (async function() {
    // ── 第一段文本：公开占位内容，由后端下发，前端不保存第二段正文 ──
    let MANUSCRIPT = [];
    try {
      const __e = await fetch('/api/before-sarcophagus/entry');
      if (__e.ok) {
        const __d = await __e.json();
        if (Array.isArray(__d.manuscript)) MANUSCRIPT = __d.manuscript;
      }
    } catch (_e) { /* 网络异常时使用下方占位文本 */ }
    if (!MANUSCRIPT.length) {
      MANUSCRIPT = [{ type: 'p', text: '滚滚长江东逝水，浪花淘尽英雄。' }];
    }

    // ── 与终局页相同的分段渲染逻辑，避免 HTML 标签被截断 ──
    function splitKeepingTags(text) {
      const tags = [];
      const protectedText = text.replace(/<[^>]+>/g, (m) => {
        tags.push(m);
        return `\u0000${tags.length-1}\u0000`;
      });
      const rawChunks = protectedText.split(/(?<=[。，、——])/);
      const chunks = [];
      let buffer = '';
      let openCount = 0;
      for (const raw of rawChunks) {
        let restored = raw.replace(/\u0000(\d+)\u0000/g, (_, i) => tags[+i]);
        buffer += restored;
        const opens = (restored.match(/<(b|s|span)[^>]*>/g) || []).length;
        const closes = (restored.match(/<\/(b|s|span)>/g) || []).length;
        openCount += opens - closes;
        if (openCount <= 0) {
          chunks.push(buffer);
          buffer = '';
          openCount = 0;
        }
      }
      if (buffer) chunks.push(buffer);
      return chunks;
    }

    function renderManuscript(container, data) {
      data.forEach(block => {
        if (block.type === 'p') {
          const p = document.createElement('p');
          const chunks = splitKeepingTags(block.text);
          chunks.forEach(chunk => {
            if (!chunk) return;
            const span = document.createElement('span');
            span.className = 'ln';
            span.innerHTML = chunk;
            p.appendChild(span);
          });
          container.appendChild(p);
        } else if (block.type === 'aside') {
          const div = document.createElement('div');
          div.className = 'aside';
          div.innerHTML = `<span class="tag">[@]</span>${block.text}`;
          container.appendChild(div);
        }
      });
    }

    function observeManuscript(container) {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) entry.target.classList.add('seen');
        });
      }, { threshold: 0.6, rootMargin: '0px 0px -10% 0px' });
      container.querySelectorAll('.ln, .aside').forEach(el => observer.observe(el));
    }

    const manuscriptContainer = document.getElementById('manuscript');
    renderManuscript(manuscriptContainer, MANUSCRIPT);
    observeManuscript(manuscriptContainer);

    const unlockContainer = document.getElementById('unlock');
    const gate = document.getElementById('invert-gate');
    const gateInput = document.getElementById('gate-input');
    const gateError = document.getElementById('gate-error');
    let resetGeneration = 0;
    let unlockAudio = null;

    function showUnlocked(data, shouldPlayAudio) {
      unlockContainer.innerHTML = '';
      renderManuscript(unlockContainer, Array.isArray(data.manuscript) ? data.manuscript : []);
      unlockContainer.classList.add('revealed');
      observeManuscript(unlockContainer);
      gate.style.display = 'none';

      if (shouldPlayAudio !== false && data.audioUrl) {
        if (unlockAudio) {
          unlockAudio.pause();
          unlockAudio = null;
        }
        unlockAudio = new Audio(data.audioUrl);
        unlockAudio.play().catch(() => { /* 浏览器自动播放策略阻止时忽略 */ });
      }
    }

    // ── 返回初始状态：中断 BGM、清空解锁进度，恢复密钥输入入口 ──
    function resetToInitialState() {
      resetGeneration += 1;
      sessionStorage.removeItem('before_sarco_token');
      sessionStorage.removeItem('before_sarco_exp');
      if (unlockAudio) {
        unlockAudio.pause();
        unlockAudio.currentTime = 0;
        unlockAudio = null;
      }
      unlockContainer.innerHTML = '';
      unlockContainer.classList.remove('revealed');
      gate.style.display = '';
      gateInput.disabled = false;
      gateInput.value = '';
      gateError.textContent = '这句话没有说完';
      gateError.classList.remove('show');
      manuscriptContainer.innerHTML = '';
      renderManuscript(manuscriptContainer, MANUSCRIPT);
      observeManuscript(manuscriptContainer);
      window.scrollTo(0, 0);
      gateInput.focus();
    }

    // ── 五分钟进度恢复：token 存在 sessionStorage，刷新后由后端二次校验 ──
    async function restoreUnlock() {
      const requestGeneration = resetGeneration;
      const token = sessionStorage.getItem('before_sarco_token');
      const expires = Number(sessionStorage.getItem('before_sarco_exp') || '0');
      if (!token || Date.now() >= expires) {
        sessionStorage.removeItem('before_sarco_token');
        sessionStorage.removeItem('before_sarco_exp');
        return false;
      }
      try {
        const res = await fetch('/api/before-sarcophagus/access', {
          headers: { 'Authorization': `Bearer ${token}` },
        });
        if (!res.ok) {
          sessionStorage.removeItem('before_sarco_token');
          sessionStorage.removeItem('before_sarco_exp');
          return false;
        }
        const data = await res.json();
        if (data.valid) {
          if (requestGeneration !== resetGeneration) return false;
          showUnlocked(data, false);
          return true;
        }
      } catch (_e) { /* 网络异常时不清理本地进度 */ }
      return false;
    }

    async function submitInput(inputValue) {
      try {
        const res = await fetch('/api/before-sarcophagus/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ input: inputValue })
        });
        const data = await res.json();

        if (res.status === 429 || data.locked) {
          gateError.textContent = `LOCKED · ${data.remaining || 60}s`;
          gateError.classList.add('show');
          gateInput.value = '';
          gateInput.focus();
          setTimeout(() => gateError.classList.remove('show'), 3000);
          return;
        }
        if (!data.correct) {
          gateError.textContent = 'False Signal';
          gateError.classList.add('show');
          gateInput.value = '';
          gateInput.focus();
          setTimeout(() => gateError.classList.remove('show'), 3000);
          return;
        }

        gateInput.blur();
        gateInput.disabled = true;
        sessionStorage.setItem('before_sarco_token', data.unlockToken);
        sessionStorage.setItem('before_sarco_exp', String(data.expiresAtMs));
        showUnlocked(data, true);
      } catch (_err) {
        gateError.textContent = 'CONNECTION ERROR';
        gateError.classList.add('show');
        setTimeout(() => gateError.classList.remove('show'), 3000);
      }
    }

    gateInput.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      const val = gateInput.value.trim();
      if (val) submitInput(val);
    });

    document.getElementById('btn-back').addEventListener('click', resetToInitialState);

    gateInput.focus();
    window.scrollTo(0, 0);
    restoreUnlock();
  })();
</script>
</body>
</html>
